{
  "dataset_csv": "data/processed/paired_dataset.csv",
  "feature_columns_json": "models/feature_columns.json",
  "qb_model": "models/qb_model.pkl",
  "qs_model": "models/qs_model.pkl",
  "training_report_json": "models/training_report.json",
  "cv_predictions_csv": "data/processed/cv_predictions.csv",
  "evaluation_predictions_csv": "data/processed/evaluation_predictions.csv",
  "metrics_csv": "reports/tables/metrics.csv",
  "group_column": "scenario_id",
  "n_splits": 5,
  "random_state": 42,
  "model": {
    "preferred": "xgboost",
    "fallback": "hist_gradient_boosting",
    "ridge_l2": 1.0e-6,
    "xgboost_params": {
      "n_estimators": 600,
      "max_depth": 4,
      "learning_rate": 0.03,
      "subsample": 0.85,
      "colsample_bytree": 0.85,
      "objective": "reg:squarederror",
      "random_state": 42,
      "n_jobs": -1
    }
  },
  "validity_gate": {
    "valid_max": 0.05,
    "caution_max": 0.10
  },
  "zones": {
    "shallow": [0.02, 0.20],
    "middle": [0.20, 0.60],
    "deep": [0.60, 0.90],
    "full": [0.02, 0.90]
  },
  "holdouts": {
    "unseen_geometry": "G8",
    "velocity_high": "V_HIGH",
    "aggressive_mgs": 100,
    "benchmark_scenario": "G0_DENS_HIGH_V_REF"
  }
}
